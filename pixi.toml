[workspace]
authors = ["Alex Winters <ajw5296@psu.edu>"]
channels = ["conda-forge"]
name = "RC-exporter"
platforms = ["linux-64", "win-64"]
version = "0.1.0"

[tasks]
app = { cmd = "python -m rc_exporter.app", env = { PYTHONPATH = "src" } }
test = { cmd = "pytest -q", env = { PYTHONPATH = "src" } }
build = "pyinstaller --noconfirm --onefile --windowed --name RC-Exporter --paths src src/rc_exporter/app.py"

[dependencies]
python = "3.12.*"
pandas = ">=3.1.0,<4"
tk = ">=8.6.13,<9"
python-dotenv = ">=1.2.4,<2"
openpyxl = ">=3.1.5,<4"
pytest = ">=9.1.1,<10"
pyinstaller = ">=6.22.3,<7"

[pypi-dependencies]
pycap = ">=2.7.0, <3"
